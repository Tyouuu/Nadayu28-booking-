<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nadayu28" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <title>Nadayu28 Community Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              'nadayu-bg':      '#F8FAFC',
              'nadayu-panel':   '#0F172A',
              'nadayu-accent':  '#2563EB',
              'nadayu-success': '#16A34A',
              'nadayu-border':  '#E2E8F0',
              'nadayu-muted':   '#64748B',
              'nadayu-cream':   '#F1F5F9',
            },
            animation: {
              'fade-in': 'fadeIn 0.8s ease-in-out',
              'slide-up': 'slideUp 0.6s ease-out',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'shimmer': 'shimmer 2s infinite',
              'glow': 'glow 2s ease-in-out infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-1000px 0' },
                '100%': { backgroundPosition: '1000px 0' },
              },
              glow: {
                '0%, 100%': { boxShadow: '0 0 20px rgba(17, 17, 17, 0.15)' },
                '50%': { boxShadow: '0 0 30px rgba(17, 17, 17, 0.25)' },
              },
            }
          }
        }
      }
    </script>
    <style>
      * {
        scrollbar-width: thin;
        scrollbar-color: #cbd5e1 #f1f5f9;
      }

      body {
        background: #ffffff;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        min-height: 100vh;
      }

      html {
        scroll-behavior: smooth;
      }

      /* Custom Scrollbar - Webkit browsers */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      
      ::-webkit-scrollbar-track {
        background: #f3f4f6;
        border-radius: 10px;
      }
      
      ::-webkit-scrollbar-thumb {
        background: #999;
        border-radius: 10px;
        transition: all 0.3s ease;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #666;
      }

      /* Custom focus styles for better accessibility */
      *:focus-visible {
        outline: 2px solid #0F172A;
        outline-offset: 2px;
      }

      button:focus-visible {
        outline: 2px solid #0F172A;
        outline-offset: 0;
      }

      /* Smooth transitions for all interactive elements */
      button, a, input, select, textarea {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Enhanced gradient text */
      .bg-clip-text {
        -webkit-background-clip: text;
        background-clip: text;
      }

      /* Custom selection color */
      ::selection {
        background-color: #0F172A;
        color: white;
      }

      ::-moz-selection {
        background-color: #0F172A;
        color: white;
      }

      /* Date picker styling */
      input[type="date"]::-webkit-calendar-picker-indicator {
        filter: invert(0);
        cursor: pointer;
      }
      input[type="date"] {
        color-scheme: light;
      }

      /* Backdrop blur support */
      @supports (backdrop-filter: blur(1px)) {
        .backdrop-blur-md {
          backdrop-filter: blur(12px);
        }
      }

      /* Smooth page transitions */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-fade-in {
        animation: fadeIn 0.8s ease-in-out;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
